name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts skips `prepare` (a full build); patch-package runs explicitly.
      - run: npm ci --ignore-scripts
      - run: npx patch-package
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # A resource read returns a whole bundle; Vercel caps function responses at 4.5 MB.
      - name: Bundles under 4 MiB
        run: |
          node -e '
            const fs = require("fs");
            const limit = 4 * 1024 * 1024;
            let over = 0;
            for (const f of fs.readdirSync("dist").filter((f) => f.endsWith(".html"))) {
              const size = fs.statSync(`dist/${f}`).size;
              console.log(`${f}: ${size} bytes`);
              if (size > limit) { console.error(`${f} is over ${limit} bytes`); over++; }
            }
            process.exit(over ? 1 : 0);
          '
